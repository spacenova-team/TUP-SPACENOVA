<button (click)="toggleMenu()" class="sidenav-btn">
  <span class="material-icons">menu</span>
</button>
<mat-sidenav-container class="sidenav-conteiner">
  <mat-sidenav class="sidenav-list" mode="side" opened="{{ openmenu }}">
    <mat-nav-list class="sidenav-items">
      @for (item of menuItems; track item.text) {
      <a class="sidenav-item-link" [routerLink]="item.route">
        <span class="material-icons item-link-icon">{{item.icon}}</span>
        <span class="item-link-text">{{ item.text }}</span>
      </a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <ng-content> </ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
<nav class="navbar-mobile">
  @for (item of menuItems; track item.text) {
  <a class="sidenav-item-link" [routerLink]="item.route">
    <span class="material-icons item-link-icon">{{item.icon}}</span>
    <span matListItemTitle class="item-link-text">{{ item.text }}</span>
  </a>
  }
</nav>
