<section class="login">
  <div class="login-img">
    <img src="/assets/milky-way-img.jpg" alt="photo of andromeda taken by nasa" />
  </div>
  <div class="login-data">
    <div class="login-container">
      <div class="login-brand">
        <img src="/assets/spacenova-logo.png" alt="spacenova logo" />
        <h3 class="brand-title">{{'brand-name' | translate}}</h3>
      </div>
      <h2 class="login-title">{{'login.title' | translate}}</h2>
      <button matButton (click)="login()" class="button-google-login">{{'login.button-google' | translate}}</button>
    </div>

  </div>
</section>
